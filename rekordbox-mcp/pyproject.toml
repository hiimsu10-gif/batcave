[project]
name = "rekordbox-mcp"
version = "0.1.0"
description = "Connect Claude Desktop to your Rekordbox library: search, build sets, tag, clean up, and find new music."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "pyrekordbox>=0.4.4,<0.5",
    "mutagen>=1.47",
]

[project.scripts]
rekordbox-mcp = "rekordbox_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rekordbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
